name: PR Test Coverage Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Rzhan9/prtestbot@main
        with:
          llm_api_key: ${{ secrets.ANTHROPIC_API_KEY }}  # Change YOUR_API_KEY_SECRET to your own LLM API key.
          llm_provider: anthropic  # Options: anthropic, gemini, openai.
          llm_model: claude-opus-4-5  # Optional: pin a specific model.
